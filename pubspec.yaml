publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  intl: ^0.20.2
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  uuid: ^4.6.0
  cupertino_icons: ^1.0.9
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
